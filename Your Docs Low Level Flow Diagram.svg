<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Your Docs Low Level Flow Diagram</title>
  <desc id="desc">Low level flow diagram showing React frontend, gateway service, auth service, docs service, websocket service, prediction service, PostgreSQL, OpenRouter, AWS EC2, Docker Compose, Nginx, and Jenkins deployment flow.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #cfd7e6; stroke-width: 2; }
      .zone { fill: #eef6ff; stroke: #8bb8e8; stroke-width: 2; stroke-dasharray: 8 8; }
      .zone2 { fill: #f3fbf2; stroke: #8fcf94; stroke-width: 2; stroke-dasharray: 8 8; }
      .zone3 { fill: #fff7e8; stroke: #e2b45e; stroke-width: 2; stroke-dasharray: 8 8; }
      .box { fill: #ffffff; stroke: #233044; stroke-width: 2; rx: 8; }
      .frontend { fill: #e9f7ff; }
      .gateway { fill: #fff0d9; }
      .service { fill: #ecf8ee; }
      .database { fill: #f5edff; }
      .external { fill: #fff2f2; }
      .deploy { fill: #f0f2f7; }
      .title { font: 700 34px Arial, sans-serif; fill: #152033; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #526071; }
      .label { font: 700 18px Arial, sans-serif; fill: #152033; }
      .small { font: 500 14px Arial, sans-serif; fill: #526071; }
      .tiny { font: 500 12px Arial, sans-serif; fill: #526071; }
      .zoneLabel { font: 700 17px Arial, sans-serif; fill: #233044; }
      .arrow { stroke: #233044; stroke-width: 2.5; fill: none; marker-end: url(#arrowHead); }
      .arrowAlt { stroke: #476f9f; stroke-width: 2.5; fill: none; marker-end: url(#arrowHeadBlue); }
      .arrowLive { stroke: #16834b; stroke-width: 2.5; fill: none; marker-end: url(#arrowHeadGreen); }
      .arrowPred { stroke: #aa4a44; stroke-width: 2.5; fill: none; marker-end: url(#arrowHeadRed); }
      .arrowDeploy { stroke: #59677c; stroke-width: 2.5; fill: none; marker-end: url(#arrowHeadGray); stroke-dasharray: 6 6; }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#233044"/>
    </marker>
    <marker id="arrowHeadBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#476f9f"/>
    </marker>
    <marker id="arrowHeadGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16834b"/>
    </marker>
    <marker id="arrowHeadRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#aa4a44"/>
    </marker>
    <marker id="arrowHeadGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#59677c"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1050"/>
  <text class="title" x="60" y="62">Your Docs - Low Level Flow Diagram</text>
  <text class="subtitle" x="60" y="94">React frontend, FastAPI gateway, backend microservices, database, live collaboration, prediction, and deployment flow</text>

  <rect class="zone" x="50" y="135" width="330" height="730" rx="18"/>
  <text class="zoneLabel" x="75" y="168">Frontend Layer</text>

  <rect class="zone3" x="430" y="135" width="310" height="730" rx="18"/>
  <text class="zoneLabel" x="455" y="168">Gateway Layer</text>

  <rect class="zone2" x="790" y="135" width="430" height="730" rx="18"/>
  <text class="zoneLabel" x="815" y="168">Internal Microservices</text>

  <rect class="panel" x="1270" y="135" width="280" height="730" rx="18"/>
  <text class="zoneLabel" x="1295" y="168">Data and External Systems</text>

  <rect class="box frontend" x="95" y="210" width="230" height="88"/>
  <text class="label" x="132" y="245">React Frontend</text>
  <text class="small" x="124" y="271">docs-react application</text>

  <rect class="box frontend" x="95" y="350" width="230" height="88"/>
  <text class="label" x="135" y="385">Axios Client</text>
  <text class="small" x="119" y="411">adds Bearer JWT token</text>

  <rect class="box frontend" x="95" y="490" width="230" height="98"/>
  <text class="label" x="126" y="526">Lexical Editor</text>
  <text class="small" x="119" y="552">rich text state as JSON</text>

  <rect class="box frontend" x="95" y="640" width="230" height="98"/>
  <text class="label" x="128" y="676">WebSocket Client</text>
  <text class="small" x="117" y="702">/ws/{doc_id}?token=...</text>

  <rect class="box gateway" x="470" y="275" width="230" height="108"/>
  <text class="label" x="514" y="314">Gateway Service</text>
  <text class="small" x="498" y="342">FastAPI public entrypoint</text>
  <text class="tiny" x="505" y="363">HTTP proxy routes</text>

  <rect class="box gateway" x="470" y="560" width="230" height="108"/>
  <text class="label" x="498" y="599">Gateway WS Proxy</text>
  <text class="small" x="497" y="627">bridges browser socket</text>
  <text class="tiny" x="510" y="648">to websocket-service</text>

  <rect class="box service" x="850" y="205" width="300" height="86"/>
  <text class="label" x="946" y="240">Auth Service</text>
  <text class="small" x="891" y="266">signup, login, logout, JWT sessions</text>

  <rect class="box service" x="850" y="335" width="300" height="86"/>
  <text class="label" x="948" y="370">Docs Service</text>
  <text class="small" x="896" y="396">documents, roles, blocks, access</text>

  <rect class="box service" x="850" y="505" width="300" height="96"/>
  <text class="label" x="915" y="542">WebSocket Service</text>
  <text class="small" x="895" y="568">rooms, sessions, block broadcast</text>

  <rect class="box service" x="850" y="680" width="300" height="96"/>
  <text class="label" x="916" y="717">Prediction Service</text>
  <text class="small" x="900" y="743">next-word prediction endpoint</text>

  <rect class="box database" x="1310" y="280" width="200" height="108"/>
  <text class="label" x="1359" y="319">PostgreSQL</text>
  <text class="small" x="1339" y="347">Users, Docs, Blocks</text>
  <text class="tiny" x="1337" y="368">Sessions, Participants</text>

  <rect class="box external" x="1310" y="680" width="200" height="96"/>
  <text class="label" x="1353" y="717">OpenRouter</text>
  <text class="small" x="1345" y="743">external AI model</text>

  <rect class="box deploy" x="95" y="910" width="230" height="82"/>
  <text class="label" x="154" y="944">Jenkins</text>
  <text class="small" x="121" y="970">build and deploy pipeline</text>

  <rect class="box deploy" x="470" y="910" width="230" height="82"/>
  <text class="label" x="510" y="944">AWS EC2 + Nginx</text>
  <text class="small" x="499" y="970">reverse proxy to gateway</text>

  <rect class="box deploy" x="850" y="910" width="300" height="82"/>
  <text class="label" x="932" y="944">Docker Compose</text>
  <text class="small" x="910" y="970">runs gateway and services</text>

  <path class="arrowAlt" d="M325 394 H470"/>
  <text class="tiny" x="347" y="382">HTTP API calls</text>

  <path class="arrowLive" d="M325 690 H470"/>
  <text class="tiny" x="344" y="678">WebSocket connection</text>

  <path class="arrow" d="M700 302 C765 260, 785 248, 850 248"/>
  <text class="tiny" x="730" y="250">/login_user</text>

  <path class="arrow" d="M700 335 C760 360, 790 378, 850 378"/>
  <text class="tiny" x="730" y="374">/create_docs, /get_doc</text>

  <path class="arrowPred" d="M700 365 C760 610, 788 728, 850 728"/>
  <text class="tiny" x="715" y="650">/predict</text>

  <path class="arrowLive" d="M700 614 H850"/>
  <text class="tiny" x="730" y="602">downstream WS</text>

  <path class="arrow" d="M1150 248 C1220 248, 1250 300, 1310 318"/>
  <path class="arrow" d="M1150 378 C1215 378, 1250 352, 1310 344"/>
  <path class="arrowLive" d="M1150 553 C1215 553, 1260 385, 1310 365"/>

  <path class="arrowPred" d="M1150 728 H1310"/>
  <text class="tiny" x="1187" y="716">chat completions API</text>

  <path class="arrowAlt" d="M210 298 V350"/>
  <path class="arrowAlt" d="M210 438 V490"/>
  <text class="tiny" x="225" y="465">editor save/update</text>

  <path class="arrowLive" d="M210 588 V640"/>
  <text class="tiny" x="225" y="618">live updates</text>

  <path class="arrowPred" d="M325 535 C410 520, 440 430, 470 360"/>
  <text class="tiny" x="335" y="512">prediction request</text>

  <path class="arrowDeploy" d="M325 951 H470"/>
  <path class="arrowDeploy" d="M700 951 H850"/>
  <path class="arrowDeploy" d="M1000 910 V776"/>
  <text class="tiny" x="1015" y="865">containers run services</text>

  <rect class="panel" x="60" y="790" width="680" height="56" rx="8"/>
  <text class="small" x="82" y="814">Core runtime: Frontend sends all HTTP and WebSocket traffic to gateway. Gateway routes to internal services.</text>
  <text class="small" x="82" y="836">Auth, docs, and websocket services use PostgreSQL. Prediction service uses OpenRouter and fallback logic.</text>

  <rect class="panel" x="790" y="790" width="730" height="56" rx="8"/>
  <text class="small" x="812" y="814">Collaboration model: WebSocket service keeps in-memory rooms and persists block updates to Doc_Blocks.</text>
  <text class="small" x="812" y="836">Deployment model: Jenkins prepares env, builds images, deploys to EC2, and Nginx forwards public traffic to gateway.</text>
</svg>
